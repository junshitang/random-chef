<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么 🍳</title>
<style>
:root {
  --bg: #f5f5f5;
  --card: #fff;
  --accent: #e07b39;
  --accent-light: #fef0e4;
  --accent-gradient: linear-gradient(135deg, #e07b39 0%, #f09a5a 100%);
  --text: #1a1a1a;
  --text2: #999;
  --text3: #bbb;
  --border: #f0f0f0;
  --danger: #e8533f;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 28px rgba(0,0,0,0.12);
  --shadow-btn: 0 4px 14px rgba(224,123,57,0.3);
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 24px;
  --sidebar-w: 220px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Header */
.header {
  background: var(--accent-gradient);
  color: #fff;
  padding: 14px 24px;
  text-align: center;
  box-shadow: 0 2px 20px rgba(224,123,57,0.2);
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
}
.header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.02em; }
.header p { font-size: 0.75rem; opacity: 0.8; font-weight: 400; }
.header-text { text-align: center; }

/* Hamburger */
.hamburger {
  display: none;
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: #fff;
  font-size: 1.5rem;
  cursor: pointer;
  z-index: 31;
  padding: 6px;
  line-height: 1;
}

/* === App Layout === */
.app-layout {
  display: flex;
  min-height: calc(100vh - 100px);
  max-width: 1100px;
  margin: 0 auto;
}

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 16px 10px;
  overflow-y: auto;
  position: sticky;
  top: 58px;
  max-height: calc(100vh - 58px);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 16px;
  margin-bottom: 2px;
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  border-radius: 12px;
  transition: all var(--transition);
  user-select: none;
  text-decoration: none;
}
.nav-item:hover { background: #fafafa; }
.nav-item.active {
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  box-shadow: var(--shadow-btn);
}
.nav-item .badge {
  margin-left: auto;
  font-size: 0.7rem;
  background: rgba(0,0,0,0.08);
  color: var(--text2);
  padding: 2px 8px;
  border-radius: 10px;
  min-width: 22px;
  text-align: center;
  font-weight: 600;
}
.nav-item.active .badge {
  background: rgba(255,255,255,0.25);
  color: #fff;
}
.nav-divider {
  height: 1px;
  background: var(--border);
  margin: 8px 12px;
}
.nav-section-title {
  padding: 8px 16px 4px;
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--text3);
  letter-spacing: 0.06em;
}

/* Sidebar backdrop (mobile) */
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 39;
}

/* Main content */
.main-content {
  flex: 1;
  padding: 24px 28px;
  overflow-y: auto;
  max-width: 780px;
}

/* View toggling */
.view { display: none; }
.view.active { display: block; }

/* Cards */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}
.card-title {
  font-size: 1.05rem;
  font-weight: 700;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Add form */
.add-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.add-form input, .add-form textarea {
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-family: inherit;
  transition: border-color var(--transition), box-shadow var(--transition);
  background: #fafafa;
  color: var(--text);
}
.add-form input:focus, .add-form textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(224,123,57,0.1);
  background: #fff;
}
.add-form textarea { resize: vertical; min-height: 56px; }
.add-form button {
  padding: 12px 20px;
  background: var(--accent-gradient);
  color: #fff;
  border: none;
  border-radius: var(--radius-lg);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: var(--shadow-btn);
  letter-spacing: 0.02em;
}
.add-form button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(224,123,57,0.4); }
.add-form button:active { transform: translateY(0); }

/* Search */
.search-box { margin-bottom: 14px; }
.search-box input {
  width: 100%;
  padding: 10px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-lg);
  font-size: 0.85rem;
  background: #fafafa;
  font-family: inherit;
  transition: all var(--transition);
}
.search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(224,123,57,0.1); background: #fff; }

/* Dish list — card style */
.dish-list {
  max-height: 480px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.dish-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all var(--transition);
  border: 1px solid transparent;
}
.dish-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: #ffe0cc;
}
.dish-card:active { transform: translateY(0); }
.dish-card .dish-avatar {
  width: 48px; height: 48px;
  border-radius: 14px;
  background: linear-gradient(135deg, #fff8f0, #fef0e4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  flex-shrink: 0;
}
.dish-card .dish-info {
  flex: 1;
  min-width: 0;
}
.dish-card .dish-name {
  font-weight: 700;
  font-size: 0.95rem;
  margin-bottom: 2px;
}
.dish-card .dish-desc {
  font-size: 0.78rem;
  color: var(--text2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dish-card .dish-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.dish-card .dish-actions button {
  width: 32px; height: 32px;
  border: none; border-radius: 50%;
  cursor: pointer;
  font-size: 0.8rem;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.btn-edit { background: #fef0e4; color: var(--accent); }
.btn-edit:hover { background: var(--accent); color: #fff; }
.btn-del { background: #fef0f0; color: var(--danger); }
.btn-del:hover { background: var(--danger); color: #fff; }

.empty-hint {
  text-align: center;
  color: var(--text3);
  padding: 48px 20px;
  font-size: 0.9rem;
}

/* Edit modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(3px);
  z-index: 100;
  justify-content: center;
  align-items: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff;
  border-radius: var(--radius);
  padding: 28px 24px;
  width: 90%;
  max-width: 440px;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.92) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal h3 { margin-bottom: 16px; font-size: 1.05rem; font-weight: 700; }
.modal input, .modal textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-family: inherit;
  margin-bottom: 10px;
  background: #fafafa;
  transition: all var(--transition);
}
.modal textarea { resize: vertical; min-height: 80px; }
.modal input:focus, .modal textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(224,123,57,0.1);
  background: #fff;
}
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
.modal-btns button {
  padding: 10px 24px;
  border: none;
  border-radius: var(--radius-lg);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}
.modal-cancel { background: #f5f5f5; color: #666; }
.modal-cancel:hover { background: #eee; }
.modal-save { background: var(--accent-gradient); color: #fff; box-shadow: var(--shadow-btn); }
.modal-save:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(224,123,57,0.35); }

.icon-picker {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 14px; justify-content: flex-start;
}
.icon-picker span {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; cursor: pointer;
  border: 2px solid transparent; transition: all var(--transition);
  background: #fafafa;
}
.icon-picker span:hover { background: #fef0e4; transform: scale(1.1); }
.icon-picker span.selected { border-color: var(--accent); background: #fef0e4; box-shadow: 0 0 0 2px rgba(224,123,57,0.15); }
.dish-icon { font-size: 1.15rem; }

/* Picker */
.picker-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.picker-row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.picker-row label { font-weight: 600; font-size: 1rem; white-space: nowrap; color: var(--text); }
.picker-row input[type="number"] {
  width: 72px;
  padding: 12px;
  text-align: center;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--accent);
  font-family: inherit;
  transition: all var(--transition);
  background: #fff;
}
.picker-row input[type="number"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(224,123,57,0.1); }

.btn-random {
  padding: 14px 48px;
  background: var(--accent-gradient);
  color: #fff;
  border: none;
  border-radius: var(--radius-lg);
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: var(--shadow-btn);
  letter-spacing: 0.04em;
}
.btn-random:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(224,123,57,0.4); }
.btn-random:active { transform: translateY(0); }
.btn-random:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.result-area {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 4px;
}
.result-dish {
  background: #fefcf9;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: all var(--transition);
  box-shadow: var(--shadow-sm);
}
.result-dish:hover { border-color: #ffe0cc; box-shadow: var(--shadow-md); }
.result-dish-header {
  padding: 15px 18px;
  background: linear-gradient(135deg, #fff8f0, #fef0e4);
  font-weight: 700;
  font-size: 1.02rem;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.result-dish-header .arrow { transition: transform var(--transition); font-size: 0.7rem; color: var(--accent); }
.result-dish.open .result-dish-header .arrow { transform: rotate(90deg); }
.result-dish-body {
  padding: 0 18px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease, padding 0.35s ease;
}
.result-dish.open .result-dish-body {
  max-height: 300px;
  padding: 14px 18px;
}
.result-dish-body p {
  white-space: pre-wrap;
  font-size: 0.88rem;
  color: var(--text2);
  line-height: 1.8;
}

/* Stats / footer */
.stats-row {
  display: flex;
  gap: 16px;
  font-size: 0.82rem;
  color: var(--text2);
  justify-content: center;
  align-items: center;
  margin-top: 14px;
}
.stats-row span { font-weight: 700; color: var(--accent); }

.footer {
  text-align: center;
  padding: 28px;
  color: var(--text3);
  font-size: 0.78rem;
}

/* === Mobile === */
@media (max-width: 680px) {
  .hamburger { display: block; }
  .header-text p { display: none; }
  .header h1 { font-size: 1.15rem; }
  .header { padding: 12px 16px; }

  .app-layout { flex-direction: column; }

  .sidebar {
    position: fixed;
    top: 0; left: 0;
    width: 280px;
    height: 100vh;
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 4px 0 24px rgba(0,0,0,0.18);
    max-height: 100vh;
    padding-top: 64px;
    border-radius: 0 16px 16px 0;
  }
  .sidebar.open { transform: translateX(0); }

  .sidebar-backdrop.show { display: block; }

  .main-content { padding: 12px; }

  .dish-card .dish-avatar { width: 42px; height: 42px; font-size: 1.4rem; border-radius: 12px; }
}
</style>
</head>
<body>

<div class="header">
  <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="菜单">☰</button>
  <div class="header-text">
    <h1>🍳 今天吃什么</h1>
    <p>配好菜单，随机点菜，告别选择困难</p>
  </div>
</div>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<div class="app-layout">
  <!-- Sidebar Navigation -->
  <aside class="sidebar" id="sidebar">
    <div class="nav-item active" data-view="menu" onclick="switchView('menu')">
      📋 我的菜单
      <span class="badge" id="navDishCount">0</span>
    </div>
    <div class="nav-item" data-view="picker" onclick="switchView('picker')">
      🎲 随机点菜
    </div>
    <div class="nav-divider"></div>
    <div class="nav-section-title">分类</div>
    <div class="nav-item" data-view="staple" onclick="switchView('staple')">
      🍚 主食
      <span class="badge" style="font-size:0.65rem">即将上线</span>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <!-- View: Menu Management -->
    <div class="view active" id="viewMenu">
      <div class="card">
        <div class="card-title">📋 我的菜单</div>

        <div class="add-form" id="addForm">
          <input type="text" id="dishName" placeholder="菜名，如：番茄炒蛋" maxlength="30">
          <textarea id="dishSteps" placeholder="做法步骤..." rows="2"></textarea>
          <button onclick="addDish()">➕ 添加</button>
        </div>

        <div class="search-box">
          <input type="text" id="searchInput" placeholder="🔍 搜索菜名..." oninput="renderDishList()">
        </div>

        <div class="dish-list" id="dishList"></div>
        <div class="stats-row" style="margin-top:12px">
          共 <span id="dishCount">0</span> 道菜
          <span style="margin-left:8px;font-size:0.75rem;color:var(--text2)" id="syncStatus"></span>
        </div>
        <div id="tokenSetup" style="display:none;margin-top:14px;padding:14px;background:#fafafa;border-radius:12px;border:1px dashed #ddd">
          <p style="font-size:0.8rem;color:var(--text2);margin-bottom:8px">配置 GitHub Token 即可开启跨设备同步：</p>
          <div style="display:flex;gap:8px">
            <input type="password" id="tokenInput" placeholder="粘贴 GitHub Token..." style="flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:0.8rem;font-family:inherit;background:#fff">
            <button onclick="saveToken()" style="padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:0.8rem;cursor:pointer;white-space:nowrap;font-weight:600">保存</button>
          </div>
        </div>
      </div>
    </div>

    <!-- View: Random Picker -->
    <div class="view" id="viewPicker">
      <div class="card">
        <div class="card-title">🎲 随机点菜</div>
        <div class="picker-section">
          <div class="picker-row">
            <label for="pickCount">来几道？</label>
            <input type="number" id="pickCount" value="3" min="1" max="20">
            <span style="color:var(--text2);font-size:0.85rem">道</span>
          </div>
          <button class="btn-random" onclick="randomPick()">🎰 随机点菜</button>
          <div class="result-area" id="resultArea"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="footer">数据云端同步 · 所有设备共享菜单</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>✏️ 编辑</h3>
    <div class="icon-picker" id="iconPicker"></div>
    <input type="text" id="editName" placeholder="菜名" maxlength="30">
    <textarea id="editSteps" placeholder="做法步骤..." rows="3"></textarea>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">取消</button>
      <button class="modal-save" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'random_chef_dishes';
const GH_API = 'https://api.github.com/repos/junshitang/random-chef/contents/dishes.json';
const GH_RAW = 'https://raw.githubusercontent.com/junshitang/random-chef/master/dishes.json';
function getToken() { return localStorage.getItem('rc_gh_token') || ''; }
function setToken(t) { localStorage.setItem('rc_gh_token', t); }
let dishes = [];
let editingIndex = -1;
let editingIcon = '🍽️';
let dishesSha = null;
let lastRemoteHash = '';
let pushing = false;
let pendingPush = false;
let pushCooldown = 0;
let currentView = 'menu';

// --- View switching ---
function switchView(view) {
  currentView = view;
  // Update nav active states
  var items = document.querySelectorAll('.nav-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('active', items[i].getAttribute('data-view') === view);
  }
  // Toggle views
  document.getElementById('viewMenu').classList.toggle('active', view === 'menu');
  document.getElementById('viewPicker').classList.toggle('active', view === 'picker');
  // Close mobile sidebar
  closeSidebar();
  // Re-render
  if (view === 'menu') {
    renderDishList();
  } else if (view === 'picker') {
    document.getElementById('resultArea').innerHTML = '';
  }
}

function toggleSidebar() {
  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('sidebarBackdrop');
  sidebar.classList.toggle('open');
  backdrop.classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
}

// --- Data: GitHub-synced (local first, cloud sync in background) ---
function loadDishes() {
  var local = null;
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) local = JSON.parse(raw);
  } catch(e) {}
  if (local && local.length > 0) {
    dishes = local;
    renderAll();
  }

  fetch(GH_RAW + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(remote) {
      remote = Array.isArray(remote) ? remote : [];
      lastRemoteHash = hashStr(JSON.stringify(remote));
      var merged = {};
      for (var i = 0; i < remote.length; i++) { merged[remote[i].name] = remote[i]; }
      if (local) { for (var i = 0; i < local.length; i++) { merged[local[i].name] = local[i]; } }
      var mergedArr = [];
      for (var k in merged) { mergedArr.push(merged[k]); }
      dishes = mergedArr.length > 0 ? mergedArr : (local || remote);
      if (local && mergedArr.length > remote.length) {
        pushToGitHub();
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(dishes));
      renderAll();
    })
    .catch(function() {
      if (!local || local.length === 0) {
        dishes = [];
        renderAll();
      }
    });
}

function saveDishes() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(dishes));
  if (!pushing) {
    pushing = true;
    pushToGitHub();
  } else {
    pendingPush = true;
  }
}

async function pushToGitHub() {
  var token = getToken();
  if (!token) { pushing = false; return; }
  try {
    var content = JSON.stringify(dishes, null, 2);
    var body = { message: 'update dishes', content: btoa(unescape(encodeURIComponent(content))) };
    if (!dishesSha) {
      var info = await fetch(GH_API, { headers: { Authorization: 'token ' + token } }).then(function(r){ return r.json(); });
      dishesSha = info.sha;
    }
    body.sha = dishesSha;
    var res = await fetch(GH_API, {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    var data = await res.json();
    if (data.content && data.content.sha) {
      dishesSha = data.content.sha;
      lastRemoteHash = hashStr(JSON.stringify(dishes));
      pushCooldown = Date.now() + 15000;
    } else {
      dishesSha = null;
    }
  } catch(e) {
    dishesSha = null;
  }
  pushing = false;
  if (pendingPush) {
    pendingPush = false;
    pushing = true;
    pushToGitHub();
  }
}

function hashStr(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
  return h;
}

setInterval(function() {
  if (pushing) return;
  if (Date.now() < pushCooldown) return;
  fetch(GH_RAW + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(remote) {
      if (!Array.isArray(remote)) return;
      var h = hashStr(JSON.stringify(remote));
      if (h !== lastRemoteHash) {
        lastRemoteHash = h;
        dishes = remote;
        dishesSha = null;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dishes));
        renderAll();
      }
    })
    .catch(function(){});
}, 5000);

function renderAll() {
  renderDishList();
  renderSyncStatus();
  renderNavBadges();
}

function renderNavBadges() {
  document.getElementById('navDishCount').textContent = dishes.length;
}

function saveToken() {
  var t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  setToken(t);
  document.getElementById('tokenSetup').style.display = 'none';
  renderSyncStatus();
  dishesSha = null;
  pushToGitHub();
}

function renderSyncStatus() {
  var el = document.getElementById('syncStatus');
  var setup = document.getElementById('tokenSetup');
  if (getToken()) {
    el.textContent = '☁️ 已同步';
    if (setup) setup.style.display = 'none';
  } else {
    el.textContent = '💻 仅本机';
    if (setup) setup.style.display = 'block';
  }
}

function pickIcon(name) {
  for (var i = 0; i < ICON_RULES.length; i++) {
    if (name.indexOf(ICON_RULES[i][0]) !== -1) return ICON_RULES[i][1];
  }
  return FOOD_ICONS[Math.floor(Math.random() * FOOD_ICONS.length)];
}

// --- Menu ---
function addDish() {
  const nameEl = document.getElementById('dishName');
  const stepsEl = document.getElementById('dishSteps');
  const name = nameEl.value.trim();
  const steps = stepsEl.value.trim();
  if (!name) { nameEl.focus(); return; }
  var icon = pickIcon(name);
  dishes.push({ name, steps, icon });
  saveDishes();
  nameEl.value = '';
  stepsEl.value = '';
  nameEl.focus();
  renderDishList();
}

function deleteDish(index) {
  if (!confirm('确定删除「' + dishes[index].name + '」？')) return;
  dishes.splice(index, 1);
  saveDishes();
  renderDishList();
}

function openEdit(index) {
  editingIndex = index;
  editingIcon = dishes[index].icon || '🍽️';
  document.getElementById('editName').value = dishes[index].name;
  document.getElementById('editSteps').value = dishes[index].steps;
  renderIconPicker();
  document.getElementById('editModal').classList.add('show');
  document.getElementById('editName').focus();
}

function closeModal() {
  document.getElementById('editModal').classList.remove('show');
  editingIndex = -1;
}

function saveEdit() {
  const name = document.getElementById('editName').value.trim();
  const steps = document.getElementById('editSteps').value.trim();
  if (!name) return;
  dishes[editingIndex] = { name, steps, icon: editingIcon };
  saveDishes();
  closeModal();
  renderDishList();
}

function renderIconPicker() {
  var container = document.getElementById('iconPicker');
  container.innerHTML = FOOD_ICONS.map(function(icon) {
    return '<span class="' + (icon === editingIcon ? 'selected' : '') + '" onclick="editingIcon=\'' + icon + '\';renderIconPicker()">' + icon + '</span>';
  }).join('');
}

function renderDishList() {
  if (currentView !== 'menu') return;
  const container = document.getElementById('dishList');
  const search = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  let filtered = dishes;
  if (search) {
    filtered = dishes.filter(function(d) { return d.name.toLowerCase().includes(search); });
  }

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-hint">' + (dishes.length === 0 ? '还没有菜，在上方添加吧 👆' : '没有匹配的菜') + '</div>';
  } else {
    container.innerHTML = filtered.map(function(d) {
      var realIndex = dishes.indexOf(d);
      return '<div class="dish-card" onclick="openEdit(' + realIndex + ')">' +
        '<div class="dish-avatar">' + (d.icon || '🍽️') + '</div>' +
        '<div class="dish-info">' +
        '<div class="dish-name">' + esc(d.name) + '</div>' +
        '<div class="dish-desc">' + esc(d.steps || '暂无做法') + '</div>' +
        '</div>' +
        '<div class="dish-actions" onclick="event.stopPropagation()">' +
        '<button class="btn-edit" onclick="openEdit(' + realIndex + ')" title="编辑">✎</button>' +
        '<button class="btn-del" onclick="deleteDish(' + realIndex + ')" title="删除">✕</button>' +
        '</div></div>';
    }).join('');
  }
  document.getElementById('dishCount').textContent = dishes.length;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// --- Random Pick ---
function randomPick() {
  var count = parseInt(document.getElementById('pickCount').value) || 3;
  count = Math.max(1, Math.min(count, dishes.length));
  document.getElementById('pickCount').value = count;

  var area = document.getElementById('resultArea');
  if (dishes.length === 0) {
    area.innerHTML = '<div class="empty-hint">请先在菜单里添加几道菜 🥢</div>';
    return;
  }

  var pool = dishes.slice();
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  var picked = pool.slice(0, count);

  area.innerHTML = picked.map(function(d, idx) {
    return '<div class="result-dish" onclick="this.classList.toggle(\'open\')">' +
      '<div class="result-dish-header">' +
      '<span class="arrow">▶</span> ' +
      '<span>' + (d.icon || '🍽️') + ' ' + (idx + 1) + '. ' + esc(d.name) + '</span>' +
      '</div>' +
      '<div class="result-dish-body"><p>' + esc(d.steps || '(暂无做法)') + '</p></div>' +
      '</div>';
  }).join('');

  setTimeout(function() {
    var first = area.querySelector('.result-dish');
    if (first) first.classList.add('open');
  }, 100);

  area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// --- Auto-reload when source changes ---
(function() {
  var lastHash = null;
  async function hash(str) {
    var buf = new TextEncoder().encode(str);
    var digest = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(digest)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
  }
  setInterval(function() {
    fetch(location.href, { cache: 'no-store' }).then(function(r) {
      return r.text();
    }).then(async function(html) {
      var h = await hash(html);
      if (lastHash && h !== lastHash) location.reload();
      lastHash = h;
    }).catch(function(){});
  }, 2000);
})();
